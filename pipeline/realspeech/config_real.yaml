# 真人语音的核对配置：在 v1 合成配置的基础上，只放宽时长比例检查。
# 真人说话有停顿、语速差别大，合成音频的时长比例范围对它过严；对不齐、转写缺词等问题由 ASR 比对筛掉，
# 这里只去掉「转写几个字配几十秒音频」这类明显的错位。ASR 模型与各语言的主 ASR、交叉 ASR 沿用 v2（不用 Whisper）。
extends: ../runner/config_v2.yaml
# 每块 16,384 条（v1 为 4,096）：每块都要重新加载模型、读入音频，这段时间仍占着 GPU 锁；真人语音片段短、条数多，
# 块大一些可以减少这部分开销（三个任务轮流使用 GPU 时，4,096 条一块的 GPU 利用率只有约 30%）。
asr_chunk_size: 16384
# 真人语音片段多为几秒：Typhoon、Qwen3-ASR 按补零后的总时长组批（每批不超过 960 秒，与原来 32 条 × 30 秒的上限相同），
# 短音频一批可放到 256 条。泰语 2,000 条实测：Typhoon 128 → 300 音频秒/墙钟秒，Qwen3-ASR 103 → 147，显存峰值 12、19 GB。
asr_models:
  typhoon:
    batch_size: 256
    args: ["--max-batch-seconds", "960"]
  qwen3_asr:
    batch_size: 256
    args: ["--max-batch-seconds", "960"]
default_sec_per_char: [0.02, 1.0]
langs:
  zh: {sec_per_char: null}
  en: {sec_per_char: null}
  ja: {sec_per_char: null}
  ko: {sec_per_char: null}
  de: {sec_per_char: null}
  fr: {sec_per_char: null}
  ru: {sec_per_char: null}
  pt: {sec_per_char: null}
  es: {sec_per_char: null}
  it: {sec_per_char: null}
  id: {sec_per_char: null}
  ms: {sec_per_char: null}
  th: {sec_per_char: null}
  vi: {sec_per_char: null}
  fil: {sec_per_char: null}
  ar: {sec_per_char: null}
  tr: {sec_per_char: null}
  fa: {sec_per_char: null}
