# 真人语音的核对配置：在 v1 合成配置的基础上，只放宽时长比例检查。
# 真人说话有停顿、语速差别大，合成音频的时长比例范围对它过严；对不齐、转写缺词等问题由 ASR 比对筛掉，
# 这里只去掉「转写几个字配几十秒音频」这类明显的错位。ASR 模型与各语言的主 ASR、交叉 ASR 沿用 v2（不用 Whisper）。
extends: ../runner/config_v2.yaml
# 每块 16,384 条（v1 为 4,096）：每块都要重新加载模型、读入音频，这段时间仍占着 GPU 锁；真人语音片段短、条数多，
# 块大一些可以减少这部分开销（三个任务轮流使用 GPU 时，4,096 条一块的 GPU 利用率只有约 30%）。
asr_chunk_size: 16384
# 真人语音片段多为几秒：Typhoon、Qwen3-ASR 按补零后的总时长组批（每批不超过 960 秒，与原来 32 条 × 30 秒的上限相同），
# 短音频一批可放到 256 条。泰语 2,000 条实测：Typhoon 128 → 300 音频秒/墙钟秒，Qwen3-ASR 103 → 147，显存峰值 12、19 GB。
asr_models:
  typhoon:
    batch_size: 256
    args: ["--max-batch-seconds", "960"]
  qwen3_asr:
    batch_size: 256
    args: ["--max-batch-seconds", "960"]
  # omniASR-LLM-7B 光权重约 15 GB，每多一条都要占解码缓存，显存主要受条数限制。土耳其语 WorldSpeech 2,000 段实测：
  # 每批 16 条 41.8 音频秒/墙钟秒（峰值 20.4 GB），最多 32 条、补零后不超过 400 秒 65.7（23.2 GB），
  # 48 条 69.0（27.5 GB，离上限太近），128 条显存不足、退回逐条识别后只有 13.4
  omni_asr:
    batch_size: 32
    args: ["--max-batch-seconds", "400"]
  # GigaAM 的 RNNT 版逐帧解码，GPU 利用率约 21%，批大小 32/64/128 同速，多进程反而更慢（GPU 在进程间切换）；
  # CTC 版整批一次解码。俄语 WorldSpeech 2,000 段实测：RNNT 110、CTC 4,258 音频秒/墙钟秒，按现有规则核对通过
  # 696 对 693 段；FLEURS ru 词错误率 RNNT 7.56%、CTC 7.76%（#16）。真人语音的交叉核对改用 CTC 版
  gigaam:
    args: ["--variant", "ctc"]
default_sec_per_char: [0.02, 1.0]
langs:
  zh: {sec_per_char: null}
  en: {sec_per_char: null}
  ja: {sec_per_char: null}
  ko: {sec_per_char: null}
  de: {sec_per_char: null}
  fr: {sec_per_char: null}
  ru: {sec_per_char: null}
  pt: {sec_per_char: null}
  es: {sec_per_char: null}
  it: {sec_per_char: null}
  id: {sec_per_char: null}
  # 马来语、菲律宾语只用 omniASR 重新识别，不做交叉核对（用户 2026-11-11 决定，与波斯语相同）：FLEURS dev 上 omniASR 的
  # 词错误率 ms 8.7%、fil 7.0%，Qwen3-ASR 为 11.0%、23.1%，两者整句一致只有 14%、8%；WorldSpeech 上双重核对丢掉约九成。
  # omniASR 不输出大小写和标点，由 pipeline/realspeech/punctuate.py 还原
  ms: {sec_per_char: null, asr: omni_asr, cross_asr: null}
  th: {sec_per_char: null}
  vi: {sec_per_char: null}
  fil: {sec_per_char: null, asr: omni_asr, cross_asr: null}
  ar: {sec_per_char: null}
  tr: {sec_per_char: null}
  # 波斯语只用 nemotron-farsi 重新识别，不做交叉核对（用户 2026-11-10 决定）：omniASR 在波斯语上与主 ASR 整句一致的
  # 只有 19%，核对会丢掉 ParsVoice 约 84% 的时长；ParsVoice 作者人工转写 500 条对照，原转写词错误率 4.9%
  fa: {sec_per_char: null, cross_asr: null}
