# 实验 v1 的默认流水线配置。
# 路径都相对工作目录（--work-dir）；字符串里的 {work_dir} 会展开成工作目录的绝对路径。

# 任务抽取用的种子：同一份文本、音色库和配置，任何时候重新生成的任务都完全相同
seed: 20261104

# 每个封装调用处理多少条（一块），块是续跑的最小单位
synth_chunk_size: 1024
asr_chunk_size: 4096

# 有内置音色可用时优先用内置音色，其余语言用克隆；可在 langs.<语言>.prefer_builtin 单独覆盖
prefer_builtin: true

# 没有在 langs.<语言>.sec_per_char 单独配置时使用的「音频秒数 / 非空白字符数」范围 [下限, 上限]
default_sec_per_char: [0.03, 0.30]

# ---------------------------------------------------------------- TTS 模型
# 批次依据 #30 在 RTX 5090（32 GB）上的实测（data/T20/bench_table.md；n 条混合语言、按时长排序成批）。选取原则：用时最短，
# 并且 nvidia-smi 峰值显存不超过约 28 GB（WSL 下超出物理显存会溢出到内存、速度骤降，Whisper 批次 64 的 788 秒就是例子）。
# 每个模型的「批次—吞吐—峰值显存」：
#   omnivoice   6、8、10、12 用时相同（81 s/256 条），峰值 12–15 GB；16 106 s、32 165 s、64 188 s（31 GB）
#   qwen3_tts   克隆：开 expandable_segments，12/16/24 → 172/152/99 s，峰值 12/18/19 GB；builtin：24/32 → 123/121 s，17/24 GB
#   vieneu      builtin：32/64/128 → 29/18/17 s（195 条），2 GB
#   voxcpm2、indextts25：逐条合成，批次不影响速度；多进程见各模型注释
# ASR 批次：qwen3_asr 32 → 69 s/1024 条（22 GB）、64 同速（27 GB）；whisper 32 → 67 s（12 GB）、64 溢出 789 s；typhoon 32（20 GB）、
#   64 为 31 GB；gigaam 32/64/128 同速；haas_ja 64 与 128 同速；whisper_fa 64（6 GB）；nemotron_farsi 8（23 GB，16 以上超过 26 GB）；jais_asr 8（24 GB）
# langs：该模型支持的语言；clone：能否用参考片段克隆；needs_ref_text：克隆是否需要参考文本；
# builtin_langs：内置音色能直接说的语言；aliases：音色库 source_model 里可能出现的别名
# gpu：false 的封装不经 gpu.lock；env_vars：运行该封装时额外设置的环境变量
tts_models:
  omnivoice:
    batch_size: 8   # 批次 8 最快（#30：6、8、10、12 的用时相同，4 与 16 以上更慢），多进程无收益
    chunk_size: 2048
    env: envs/tts-omnivoice
    module: pipeline.tts.omnivoice
    langs: [zh, en, ja, ko, de, fr, ru, pt, es, it, id, ms, th, vi, fil, ar, tr, fa]
    clone: true
    needs_ref_text: true
    builtin_langs: []
  voxcpm2:
    batch_size: 8   # 上游逐条合成；多进程 2 个无收益（#30），批量大小只影响写盘粒度
    chunk_size: 512
    env: envs/tts-voxcpm2
    module: pipeline.tts.voxcpm2
    langs: [zh, en, ja, ko, de, fr, ru, pt, es, it, id, ms, th, vi, fil, ar, tr]
    clone: true
    needs_ref_text: false
    builtin_langs: []
  qwen3_tts:
    batch_size: 24   # 开 expandable_segments 后批次 24 峰值约 19 GB（不开时 10 就接近 32 GB）
    chunk_size: 2048
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    env: envs/tts-qwen3
    module: pipeline.tts.qwen3_tts
    aliases: [qwen3-tts, qwen3-tts-customvoice, qwen3-tts-base]
    langs: [zh, en, ja, ko, de, fr, ru, pt, es, it]
    clone: true
    needs_ref_text: true
    builtin_langs: [zh, en, ja, ko, de, fr, ru, pt, es, it]
  indextts25:
    batch_size: 4   # 逐条合成；多进程 2 个只快约 15%、显存翻倍，不采用
    chunk_size: 512
    env: envs/tts-indextts25
    module: pipeline.tts.indextts25
    aliases: [indextts-2.5]
    langs: [zh, en, ja, es, ar]
    clone: true
    needs_ref_text: false
    builtin_langs: []
    args: [--model-dir, "{work_dir}/src/index-tts/checkpoints"]
  vieneu:
    batch_size: 64   # 批次 64 与 128 用时相同，显存只有 2 GB
    chunk_size: 2048
    env: envs/tts-vieneu
    module: pipeline.tts.vieneu
    aliases: [vieneu-v3-turbo]
    langs: [vi]
    clone: true
    needs_ref_text: false
    builtin_langs: [vi]
  supertonic3:           # 只有内置音色，没有按语言配置权重时不会被抽到
    batch_size: 16   # CPU，不占 GPU
    chunk_size: 1024
    env: envs/tts-supertonic3
    module: pipeline.tts.supertonic3
    aliases: [supertonic-3]
    langs: [en, ko, ja, ar, de, es, fr, id, it, pt, ru, tr, vi]
    clone: false
    builtin_langs: [en, ko, ja, ar, de, es, fr, id, it, pt, ru, tr, vi]
    gpu: false

# ---------------------------------------------------------------- ASR 模型
asr_models:
  qwen3_asr:
    batch_size: 32
    env: envs/asr-qwen3
    module: pipeline.asr.qwen3_asr
  whisper:
    batch_size: 32
    env: envs/asr-qwen3
    module: pipeline.asr.whisper
  whisper_fa:
    batch_size: 64
    env: envs/asr-nemo-fa
    module: pipeline.asr.whisper_fa
  nemotron_farsi:
    batch_size: 8
    env: envs/asr-nemo-fa
    module: pipeline.asr.nemotron_farsi
  gigaam:
    batch_size: 64
    env: envs/asr-gigaam
    module: pipeline.asr.gigaam
  haas_ja:
    batch_size: 64
    env: envs/asr-nemo
    module: pipeline.asr.haas_ja
    env_vars:
      PYTHONPATH: "{work_dir}/src/Haas-ASR/src"
  typhoon:
    batch_size: 32
    env: envs/asr-hf
    module: pipeline.asr.typhoon
  jais_asr:
    batch_size: 8
    env: envs/asr-hf
    module: pipeline.asr.jais_asr

# ---------------------------------------------------------------- 按语言
# tts：可用的 TTS 模型及权重（依据 research/training-data-selection-zh.md 的推荐表）；
# asr：主 ASR；cross_asr：可选的交叉 ASR，只对主 ASR 已一致的样本运行，两者都一致才算通过；
# sec_per_char：「音频秒数 / 非空白字符数」的合理范围 [下限, 上限]，范围参照 FLEURS 各语言的实际语速，
#   上限留出余量，用来拦下 TTS 失控的长音频，下限拦下被截断的短音频
# 各语言 TTS 权重按 #21 试验中「语言 × TTS 模型」的通过率调整：通过率高的模型权重大，OmniVoice（约 27%）只保留少量以保持音色多样；
# IndexTTS 在 zh、ja、en、es 上未经试验，给权重 1 观察通过率。
langs:
  zh:
    tts: {qwen3_tts: 3, indextts25: 1, omnivoice: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.07, 0.60]
  en:
    tts: {supertonic3: 4, omnivoice: 2, qwen3_tts: 2, indextts25: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.03, 0.22]
  ja:
    tts: {qwen3_tts: 3, supertonic3: 3, indextts25: 1, omnivoice: 1}
    asr: haas_ja
    cross_asr: qwen3_asr
    sec_per_char: [0.07, 0.45]
  ko:
    tts: {supertonic3: 4, qwen3_tts: 3, omnivoice: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.07, 0.45]
  de:
    tts: {qwen3_tts: 3, supertonic3: 3, omnivoice: 2}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.03, 0.30]
  fr:
    tts: {qwen3_tts: 2, supertonic3: 2, omnivoice: 2}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.03, 0.22]
  ru:
    tts: {supertonic3: 4, voxcpm2: 2, omnivoice: 1}
    asr: gigaam
    cross_asr: qwen3_asr
    sec_per_char: [0.035, 0.20]
  pt:
    tts: {supertonic3: 3, qwen3_tts: 3, voxcpm2: 1, omnivoice: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.04, 0.22]
  es:
    tts: {qwen3_tts: 4, indextts25: 1, omnivoice: 1, supertonic3: 1, voxcpm2: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.04, 0.22]
  it:
    tts: {qwen3_tts: 4, supertonic3: 2, omnivoice: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.04, 0.24]
  id:
    tts: {supertonic3: 4, voxcpm2: 2, omnivoice: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.04, 0.24]
  ms:                      # Qwen3-ASR 的马来语明显弱于 Whisper，交叉核对误杀多（#21），不做交叉
    tts: {voxcpm2: 3, omnivoice: 1}
    asr: whisper
    sec_per_char: [0.03, 0.20]
  th:
    tts: {voxcpm2: 3, omnivoice: 1}
    asr: typhoon
    cross_asr: qwen3_asr
    sec_per_char: [0.03, 0.18]
  vi:
    tts: {vieneu: 3, omnivoice: 2, voxcpm2: 2, supertonic3: 1}
    asr: qwen3_asr
    cross_asr: whisper
    sec_per_char: [0.04, 0.25]
  fil:                     # Whisper 明显优于 Qwen3-ASR（#15 验收），不用 Qwen3-ASR 交叉
    tts: {voxcpm2: 3, omnivoice: 1}
    asr: whisper
    sec_per_char: [0.04, 0.26]
  ar:
    tts: {indextts25: 4, supertonic3: 2, omnivoice: 1}
    asr: jais_asr
    sec_per_char: [0.04, 0.26]
  tr:
    tts: {supertonic3: 4, voxcpm2: 2, omnivoice: 1}
    asr: whisper
    sec_per_char: [0.035, 0.22]
  fa:
    tts: {omnivoice: 1}
    asr: nemotron_farsi
    cross_asr: whisper_fa
    sec_per_char: [0.06, 0.36]
