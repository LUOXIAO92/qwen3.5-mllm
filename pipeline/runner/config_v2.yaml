# 实验 v2 的核对配置：在 v1 配置的基础上替换 ASR 的搭配，不再用 Whisper 核对（错误多）。
# 交叉 ASR 尽量选与主 ASR 结构不同、在该语言上不比主 ASR 差太多的模型。依据是 FLEURS dev 上的实测
# （每种语言 20–50 句，数词统一后的错误率，见 #33、#34、#35）：
#   Parakeet-tdt-0.6b-v3（TDT 结构）在 en de fr es it pt 上与 Qwen3-ASR 相近，速度约为它的 3 倍；
#   Fun-ASR-MLT-Nano 在 zh、ja、ko 上与 Qwen3-ASR 相近或更好（ja 1.1%），在 pt、ar 上明显差；
#   omniASR-LLM-7B 在 fil、ar、ms、fa 上比 Qwen3-ASR 好，tr 持平，只输出小写、无标点，所以只作交叉 ASR。
# 马来语、菲律宾语、土耳其语的主 ASR 由 Whisper 改为 Qwen3-ASR：重新识别模式用主 ASR 的结果作训练目标，需要带标点。
extends: config_v1.yaml

asr_models:
  parakeet_v3:
    batch_size: 32
    chunk_size: 256   # 每次调用最多 256 条：TDT 解码的显存随批形状种类增长，见 pipeline/asr/parakeet_v3.py
    env: envs/asr-nemo
    module: pipeline.asr.parakeet_v3
  fun_asr:
    batch_size: 1   # 上游每次只解码一条
    chunk_size: 250
    processes: 4    # 每个进程约 2 GB 显存，同时开 4 个封装子进程补回逐条解码的速度
    env: envs/asr-funasr-mlt
    module: pipeline.asr.fun_asr_mlt
    args: ["--funasr-src", "{work_dir}/src/Fun-ASR"]
  omni_asr:
    batch_size: 16   # 峰值约 26 GB
    env: envs/asr-omni
    module: pipeline.asr.omni_asr
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  cohere:
    batch_size: 32   # 显存峰值约 5.5 GB，FLEURS dev 上约 340 倍实时（#38）
    env: envs/asr-cohere
    module: pipeline.asr.cohere_transcribe
  cohere_ar:
    batch_size: 32
    env: envs/asr-cohere
    module: pipeline.asr.cohere_transcribe
    args: ["--model", "CohereLabs/cohere-transcribe-arabic-07-2026"]

# 越南语、阿拉伯语的交叉 ASR 依据 #38（FLEURS dev 各 50 句）：越南语 Cohere 6.0% 对 Fun-ASR 6.6%，速度约为 Fun-ASR 的 10 倍；
# 阿拉伯语 Cohere 阿拉伯语版 3.5% 对 omniASR 4.1%，速度约 6 倍、显存约四分之一。中文、韩语 Cohere 明显不如 Fun-ASR，
# 日语 Fun-ASR 更准，印尼语 Cohere 不支持，这四种仍用 Fun-ASR。
langs:
  zh: {asr: qwen3_asr, cross_asr: fun_asr}
  en: {asr: qwen3_asr, cross_asr: parakeet_v3}
  ja: {asr: haas_ja, cross_asr: fun_asr}
  ko: {asr: qwen3_asr, cross_asr: fun_asr}
  de: {asr: qwen3_asr, cross_asr: parakeet_v3}
  fr: {asr: qwen3_asr, cross_asr: parakeet_v3}
  ru: {asr: gigaam, cross_asr: qwen3_asr}
  pt: {asr: qwen3_asr, cross_asr: parakeet_v3}
  es: {asr: qwen3_asr, cross_asr: parakeet_v3}
  it: {asr: qwen3_asr, cross_asr: parakeet_v3}
  id: {asr: qwen3_asr, cross_asr: fun_asr}
  ms: {asr: qwen3_asr, cross_asr: omni_asr}
  th: {asr: typhoon, cross_asr: qwen3_asr}
  vi: {asr: qwen3_asr, cross_asr: cohere}
  fil: {asr: qwen3_asr, cross_asr: omni_asr}
  ar: {asr: jais_asr, cross_asr: cohere_ar}
  tr: {asr: qwen3_asr, cross_asr: omni_asr}
  fa: {asr: nemotron_farsi, cross_asr: omni_asr}
